<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat untuk Lusia 💌</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">

<div class="vignette"></div>

<header>
  <h1 id="titleClick">PAPAN SURAT?!?!? 💋</h1>
  <p>Menurut Legenda jika papan diatas ini dicium 3 kali maka akan muncul keajaiban</p>
</header>

<main class="board" id="board"></main>

<footer> ~ Lusia Andita Tristama, LOVE YOU ~ </footer>

<script>
  // Daftar surat -- tiap surat = 1 file HTML di folder letters/
  const LETTERS = [
    { id: "seneng", label: "Buka saat\nseneng", seal: "🌿", sticker: "images/sticker-seneng.png", rot: "-3deg", href: "letters/seneng.html" },
    { id: "sedih", label: "Buka saat\nsedih", seal: "🍃", sticker: "images/sticker-sedih.png", rot: "2deg", href: "letters/sedih.html" },
    { id: "tugas", label: "Buka saat\nbanyak tugas", seal: "🌱", sticker: "images/sticker-tugas.png", rot: "-1.5deg", href: "letters/tugas.html" },
    { id: "kangen", label: "Buka saat\nkangen akuu", seal: "💚", sticker: "images/sticker-kangen.png", rot: "3deg", href: "letters/kangen.html" },
    { id: "capek", label: "Buka saat\ncapek", seal: "🌿", sticker: "images/sticker-capek.png", rot: "-2deg", href: "letters/capek.html" },
    { id: "marah", label: "Buka saat\nmarah", seal: "🍀", sticker: "images/sticker-marah.png", rot: "1.5deg", href: "letters/marah.html" },
    { id: "sakit", label: "Buka saat\nsakit", seal: "🌱", sticker: "images/sticker-sakit.png", rot: "-2.5deg", href: "letters/sakit.html" },
    {
      id: "ultah", label: "BUKA TANGGAL\n21 SEPT 2026", seal: "🎂", sticker: "images/sticker-ultah.png", rot: "2deg",
      href: "letters/ultah.html", locked: true, unlockDate: "2026-09-21T00:00:00"
    },
  ];

  // Suara yang diputer pas amplop diklik, sesuai kategori suratnya.
  // Taruh file-nya di folder sounds/ dengan nama persis kayak di bawah ini.
  const CLICK_SOUNDS = {
    seneng: "sounds/seneng.mp3",
    sedih: "sounds/sedih.mp3",
    tugas: "sounds/tugas.mp3",
    kangen: "sounds/kangen.mp3",
    capek: "sounds/capek.mp3",
    marah: "sounds/marah.mp3",
    sakit: "sounds/sakit.mp3",
    ultah: "sounds/ultah.mp3",
    rahasia: "sounds/rahasia.mp3",
  };

  const board = document.getElementById("board");

  function isUnlocked(letter){
    if (!letter.locked) return true;
    return new Date() >= new Date(letter.unlockDate);
  }

  const HEART_ICON = `<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.2C1 10.1 1.6 6.8 4.2 5.1c2.2-1.4 4.9-.8 6.3 1.1.4.5.9 1.1 1.5 1.1s1.1-.6 1.5-1.1c1.4-1.9 4.1-2.5 6.3-1.1 2.6 1.7 3.2 5 1.5 7.7C18.7 16.7 12 21 12 21z"/></svg>`;

  function renderLetters(){
    board.innerHTML = "";
    LETTERS.forEach(letter => {
      const unlocked = isUnlocked(letter);
      const showSticker = !letter.locked || unlocked; // surat terkunci tetap pakai ikon gembok, jangan bocorin stiker

      const a = document.createElement("a");
      a.className = "envelope" + (letter.locked ? (unlocked ? " unlocked-special" : " locked") : "") + (letter.secret ? " secret" : "");
      a.href = letter.href;
      a.style.setProperty("--rot", letter.rot);
      a.style.transform = `rotate(${letter.rot})`;

      const pin = document.createElement("div");
      pin.className = "pin";
      a.appendChild(pin);

      if (letter.secret){
        // Amplop rahasia: selalu tampil icon love hitam, nggak gantung ke file gambar
        const heartWrap = document.createElement("div");
        heartWrap.className = "seal-placeholder secret-heart";
        heartWrap.innerHTML = HEART_ICON;
        a.appendChild(heartWrap);
      } else if (showSticker){
        const img = document.createElement("img");
        img.className = "envelope-sticker";
        img.alt = letter.id;
        img.src = letter.sticker;
        img.onerror = () => {
          const placeholder = document.createElement("div");
          placeholder.className = "seal-placeholder";
          img.replaceWith(placeholder);
        };
        a.appendChild(img);
      } else {
        const lockWrap = document.createElement("div");
        lockWrap.className = "seal-placeholder locked-icon";
        lockWrap.innerHTML = `
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
        `;
        a.appendChild(lockWrap);
      }

      const label = document.createElement("div");
      label.className = "envelope-label";
      label.textContent = letter.label;
      a.appendChild(label);

      a.addEventListener("click", (e) => handleEnvelopeClick(e, letter, unlocked));
      board.appendChild(a);
    });
  }

  // --- Pas amplop diklik: muter suara sesuai kategorinya dulu, baru pindah halaman ---
  function handleEnvelopeClick(e, letter, unlocked){
    // Surat yang masih terkunci: langsung masuk aja, nggak perlu efek suara
    if (letter.locked && !unlocked) return;

    e.preventDefault();
    const soundSrc = CLICK_SOUNDS[letter.id];
    const href = letter.href;

    if (!soundSrc){
      window.location.href = href;
      return;
    }

    let navigated = false;
    const goToLetter = () => {
      if (navigated) return;
      navigated = true;
      window.location.href = href;
    };

    const audio = new Audio(soundSrc);
    audio.addEventListener("ended", goToLetter);
    audio.addEventListener("error", () => setTimeout(goToLetter, 150));

    // Jaga-jaga: kalau suaranya kepanjangan atau event "ended" nggak kepanggil,
    // maksimal nunggu 4 detik biar nggak lama-lama.
    setTimeout(goToLetter, 4000);

    audio.play().catch(() => setTimeout(goToLetter, 150));
  }

  // --- Amplop rahasia: klik judul 3x buat munculin ---
  let titleClicks = 0;
  document.getElementById("titleClick").addEventListener("click", () => {
    titleClicks++;
    if (titleClicks === 3){
      LETTERS.push({
        id: "rahasia",
        label: "??? \n(amplop rahasia)",
        seal: "✨",
        rot: "-2deg",
        href: "letters/rahasia.html",
        secret: true
      });
      renderLetters();
    }
  });

  renderLetters();
</script>

</body>
</html>
